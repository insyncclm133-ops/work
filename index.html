    <!--
      Stale-shell self-heal.
      After a deploy the app's JS filename changes. A device still holding the
      previous cached index.html requests the old file, which no longer exists;
      Cloudflare Pages then returns index.html (HTML) for it, the browser
      refuses to run HTML as a script, and the user is left staring at a blank
      screen or a "Failed to fetch" error. This inline guard runs regardless of
      the app bundle: if the shell fails to boot (script load error, or #root
      still empty after a grace period) it clears the stale service-worker
      caches and reloads once, so nobody stays stuck on an old build. Runs at
      most once per tab session to avoid a reload loop.
    -->
    <script>
      (function () {
        var KEY = 'worksync_shell_recovered';
        var recovering = false;
        function recover() {
          if (recovering) return;
          recovering = true;
          try {
            if (sessionStorage.getItem(KEY)) return; // already tried this session
            sessionStorage.setItem(KEY, '1');
          } catch (e) {}
          var reload = function () { location.reload(); };
          var jobs = [];
          try {
            if ('serviceWorker' in navigator) {
              jobs.push(
                navigator.serviceWorker.getRegistrations().then(function (rs) {
                  return Promise.all(rs.map(function (r) { return r.unregister(); }));
                })
              );
            }
            if (window.caches && caches.keys) {
              jobs.push(
                caches.keys().then(function (ks) {
                  return Promise.all(ks.map(function (k) { return caches.delete(k); }));
                })
              );
            }
          } catch (e) {}
          Promise.all(jobs).then(reload).catch(reload);
          setTimeout(reload, 3000); // hard fallback if the cleanup hangs
        }
        // Fast path: the app's module script failed to load/parse (stale hash).
        window.addEventListener(
          'error',
          function (e) {
            var t = e && e.target;
            if (t && t.tagName === 'SCRIPT' && t.src) recover();
          },
          true
        );
        // Lazy route chunks (React.lazy / code-split pages) load well AFTER
        // boot, once the user navigates somewhere — the two guards above only
        // cover the initial page load, so a stale-cache mismatch discovered
        // mid-session (e.g. opening a page whose chunk hash rotated in a later
        // deploy) surfaced only as an uncaught promise rejection in the
        // console, with no recovery. A failed dynamic import() never fires a
        // captured 'error' event on a <script> element the way a static
        // <script src> tag does, so it needs its own listener.
        window.addEventListener('unhandledrejection', function (e) {
          var msg = (e && e.reason && (e.reason.message || String(e.reason))) || '';
          if (/fetch dynamically imported module|error loading dynamically imported module/i.test(msg)) {
            recover();
          }
        });
        // Backstop: allow a generous window for slow networks, then check that
        // React actually mounted. If #root is still empty, treat it as blank.
        window.addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('root');
            if (!root || root.childElementCount === 0) {
              recover();
            } else {
              try { sessionStorage.removeItem(KEY); } catch (e) {}
            }
          }, 12000);
        });
        // A tab left open across a deploy should pick the new build up on its
        // own rather than waiting for the user to hit an error.
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (!window.__worksyncReloading) {
              window.__worksyncReloading = true;
              location.reload();
            }
          });
          navigator.serviceWorker.ready.then(function (reg) {
            setInterval(function () { reg.update(); }, 60000);
          }).catch(function () {});
        }
      })();
    </script>
